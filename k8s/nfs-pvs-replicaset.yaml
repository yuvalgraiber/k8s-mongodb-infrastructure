apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-pv-0
spec:
  capacity:
    storage: 8Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-client
  mountOptions:
    - nfsvers=4.1
    - nolock
    - hard
  nfs:
    server: 10.87.169.123
    path: /srv/nfs/mongodb/data1
---
